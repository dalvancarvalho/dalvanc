<title>dalvanc</title>
<meta name="description" content="Dalvan Carvalho's personal page — temporarily deactivated. Visit pov.dalvanc.com.">
<link rel="icon" href="/favicon.ico" sizes="48x48">

<meta name="color-scheme" content="light dark">

<meta name="theme-color" content="#121311" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --text: #1a1b19;
    --muted: #6b6d68;
    --line: #e3e1da;
    --logo: #2563eb;
    --cursor: #1a1b19;
    --accent: #2563eb;
    --shadow: 0 1px 2px rgba(20,20,18,.06), 0 12px 32px -12px rgba(20,20,18,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121311;
      --surface: #1b1c1a;
      --text: #ecebe6;
      --muted: #9a9b95;
      --line: #2a2b28;
      --logo: #f97316;
      --cursor: #ffffff;
      --accent: #f97316;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -16px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121311; --surface: #1b1c1a; --text: #ecebe6; --muted: #9a9b95;
    --line: #2a2b28; --logo: #f97316; --cursor: #ffffff; --accent: #f97316;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -16px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 400 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color .3s, color .3s;
  }
  a { color: inherit; }

  main {
    flex: 1;
    width: 100%; max-width: 760px;
    margin: 0 auto;
    padding: clamp(48px, 10vh, 112px) 20px 48px;
  }

  /* Logo */
  .logo { display: block; width: clamp(150px, 34vw, 210px); height: auto; color: var(--logo); }
  .logo .cursor { fill: var(--cursor); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Message */
  .message {
    margin: clamp(36px, 7vh, 56px) 0 0;
    font-size: clamp(1.25rem, 3.4vw, 1.6rem);
    line-height: 1.45; font-weight: 500;
    letter-spacing: -0.015em;
    max-width: 30ch;
    text-wrap: pretty;
  }
  .message .soft { color: var(--muted); font-weight: 400; }

  /* POV card */
  .pov {
    display: block; margin-top: 40px;
    text-decoration: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: transform .25s ease, border-color .25s ease;
  }
  .pov:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .pov:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .bar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .url {
    flex: 1; min-width: 0;
    font: 500 .85rem/1 "JetBrains Mono", ui-monospace, monospace;
    color: var(--muted);
    background: var(--bg);
    border-radius: 999px; padding: 7px 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .url b { color: var(--text); font-weight: 500; }

  .shots {
    display: flex; gap: 12px;
    padding: 16px;
    overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: thin;
  }
  .shots figure {
    flex: 0 0 auto; margin: 0;
    width: calc((100% - 24px) / 3);
    aspect-ratio: 720 / 1464;
    border-radius: 12px; overflow: hidden;
    border: 1px solid var(--line);
    background: var(--bg);
    scroll-snap-align: start;
  }
  .shots img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .shots:empty { display: none; }

  .info { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 4px 20px 20px; }
  .info h2 { margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; }
  .info p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
  .go {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 6px;
    font-weight: 500; font-size: .9rem; color: var(--accent);
    white-space: nowrap;
  }
  .go svg { transition: transform .2s; }
  .pov:hover .go svg { transform: translateX(3px); }

  footer {
    width: 100%; max-width: 760px; margin: 0 auto;
    padding: 24px 20px calc(28px + env(safe-area-inset-bottom));
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    color: var(--muted); font-size: .85rem;
    border-top: 1px solid var(--line);
  }

  @media (max-width: 520px) {
    .info { flex-direction: column; align-items: flex-start; }
    .shots figure { width: 62%; }
    footer { flex-direction: column; align-items: center; text-align: center; gap: 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo .cursor { animation: none; }
    .pov, .go svg { transition: none; }
  }
</style>
</head>

<footer>
  <span>© <span id="year"></span> Dalvan Carvalho. <span data-i18n="rights"></span></span>
  <span>dalvanc.com</span>
</footer>

<script>
  /* Screenshots of pov.dalvanc.com, in order.
     Any image that fails to load is removed automatically. */
  const SCREENSHOTS = [
    "screenshots/pov-1.jpg",
    "screenshots/pov-2.jpg",
    "screenshots/pov-3.jpg"
  ];

  const STRINGS = {
    en: {
      hey: "hey, you've found my personal page!",
      body: "right now it's temporarily deactivated, but you can check out other pages of mine, like the one below:",
      povDesc: "The world through my point of view. Photographs I like, and the places I took them.",
      visit: "Visit",
      rights: "All rights reserved.",
      alt: "Screenshot of POV"
    },
    pt: {
      hey: "opa, você encontrou minha página pessoal!",
      body: "no momento ela está temporariamente desativada, mas você pode conferir outras páginas minhas, como esta aqui embaixo:",
      povDesc: "O mundo pelo meu ponto de vista. Fotografias de que gosto, e os lugares onde as tirei.",
      visit: "Acessar",
      rights: "Todos os direitos reservados.",
      alt: "Captura de tela do POV"
    },
    es: {
      hey: "¡hola, encontraste mi página personal!",
      body: "por ahora está desactivada temporalmente, pero puedes ver otras páginas mías, como la de abajo:",
      povDesc: "El mundo desde mi punto de vista. Fotografías que me gustan, y los lugares donde las tomé.",
      visit: "Visitar",
      rights: "Todos los derechos reservados.",
      alt: "Captura de pantalla de POV"
    }
  };

  // Pick language from the visitor's browser/OS locale (?lang=pt etc. overrides, handy for testing)
  function pickLang() {
    const forced = new URLSearchParams(location.search).get("lang");
    if (forced && STRINGS[forced]) return forced;
    const prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
    for (const l of prefs) {
      const base = String(l).toLowerCase().split("-")[0];
      if (STRINGS[base]) return base;
    }
    return "en";
  }

  const lang = pickLang();
  const t = STRINGS[lang];
  document.documentElement.lang = lang === "pt" ? "pt-BR" : lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n]; });
  document.getElementById("year").textContent = new Date().getFullYear();

  // Optional theme override for testing: ?theme=light | ?theme=dark
  const forcedTheme = new URLSearchParams(location.search).get("theme");
  if (forcedTheme === "light" || forcedTheme === "dark") document.documentElement.dataset.theme = forcedTheme;

  const shots = document.getElementById("shots");
  SCREENSHOTS.forEach((src, i) => {
    const fig = document.createElement("figure");
    const img = new Image();
    img.src = src;
    img.alt = `${t.alt} ${i + 1}`;
    img.loading = "lazy";
    img.decoding = "async";
    img.onerror = () => fig.remove();
    fig.appendChild(img);
    shots.appendChild(fig);
  });
</script>
